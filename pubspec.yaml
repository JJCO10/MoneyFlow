name: money_flow
description: A personal finance app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'  # Cambiamos a un rango más amplio

dependencies:
  flutter:
    sdk: flutter

  # SQLite y ORM
  sqflite: ^2.3.0
  path: ^1.8.3
  floor: ^1.4.2

  # Gráficos
  fl_chart: ^0.63.0

  # Calendario
  table_calendar: ^3.0.9

  # Gestión de estado
  get: ^4.6.5

  # Fechas
  intl: ^0.18.1

  # Iconos
  font_awesome_flutter: ^10.5.0

  # Preferencias
  shared_preferences: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  
  # Generadores de código para Floor
  build_runner: ^2.4.6
  floor_generator: ^1.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/